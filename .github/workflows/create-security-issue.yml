name: Create Security Remediation Issue

on:
  workflow_dispatch:
    inputs:
      remediation_plan:
        description: "Remediation plan markdown content"
        required: true
        type: string
      priority:
        description: "Issue priority (Low/Medium/High/Critical)"
        required: true
        type: string
      github_team_slug:
        description: "GitHub team slug to assign (from git_hub_team relation)"
        required: true
        type: string
      vulnerability_workload_id:
        description: "VulnerabilityWorkload entity identifier in Port"
        required: false
        type: string
      service_name:
        description: "Service name"
        required: true
        type: string
      cve_id:
        description: "CVE / vulnerability external ID (e.g. CVE-2024-1234)"
        required: false
        type: string
      port_run_id:
        description: "Port action run ID for callback reporting"
        required: false
        type: string

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Write remediation plan to file
        env:
          REMEDIATION_PLAN: ${{ inputs.remediation_plan }}
        run: echo "$REMEDIATION_PLAN" > /tmp/remediation_plan.md

      - name: Print inputs
        run: |
          echo "priority:                  ${{ inputs.priority }}"
          echo "github_team_slug:          ${{ inputs.github_team_slug }}"
          echo "vulnerability_workload_id: ${{ inputs.vulnerability_workload_id }}"
          echo "service_name:              ${{ inputs.service_name }}"
          echo "cve_id:                    ${{ inputs.cve_id }}"
          echo "port_run_id:               ${{ inputs.port_run_id }}"

      - name: Resolve team member
        id: resolve_member
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          MEMBER=$(gh api orgs/${{ github.repository_owner }}/teams/${{ inputs.github_team_slug }}/members --jq '.[0].login')
          echo "assignee=$MEMBER" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="[${{ inputs.priority }}]"
          [ -n "${{ inputs.cve_id }}" ] && TITLE="$TITLE ${{ inputs.cve_id }} -"
          TITLE="$TITLE ${{ inputs.service_name }}"

          PORTAL_LINK=""
          [ -n "${{ inputs.vulnerability_workload_id }}" ] && \
            PORTAL_LINK="> 🔗 [View in Port](https://app.getport.io/vulnerabilityWorkloadEntity?identifier=${{ inputs.vulnerability_workload_id }})"

          BODY=$(printf "%s\n\n---\n\n%s" "$PORTAL_LINK" "$(cat /tmp/remediation_plan.md)")

          ISSUE_URL=$(gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "security" \
            --label "priority: $(echo '${{ inputs.priority }}' | tr '[:upper:]' '[:lower:]')" \
            --assignee "${{ steps.resolve_member.outputs.assignee }}")
 
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
 
      - name: Report success to Port
        if: ${{ inputs.port_run_id != '' && success() }}
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          ACCESS_TOKEN=$(curl -s --location --request POST 'https://api.port.io/v1/auth/access_token' \
            --header 'Content-Type: application/json' \
            --data-raw "{\"clientId\": \"$PORT_CLIENT_ID\", \"clientSecret\": \"$PORT_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')
 
          curl --location --request PATCH "https://api.port.io/v1/actions/runs/${{ inputs.port_run_id }}" \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-raw "{
              \"status\": \"SUCCESS\",
              \"message\": {\"run_status\": \"GitHub issue created: ${{ steps.create_issue.outputs.issue_url }}\"}
            }"
 
      - name: Report failure to Port
        if: ${{ inputs.port_run_id != '' && failure() }}
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          ACCESS_TOKEN=$(curl -s --location --request POST 'https://api.port.io/v1/auth/access_token' \
            --header 'Content-Type: application/json' \
            --data-raw "{\"clientId\": \"$PORT_CLIENT_ID\", \"clientSecret\": \"$PORT_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')
 
          curl --location --request PATCH "https://api.port.io/v1/actions/runs/${{ inputs.port_run_id }}" \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-raw "{
              \"status\": \"FAILURE\",
              \"message\": {\"run_status\": \"GitHub issue creation failed\"}
            }"
